refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%dT%H:%M:%S%.3f)} [{l}] {t} — {m}{n}"

  file:
    kind: rolling_file
    path: logs/azure_ai_gateway.log
    policy:
      trigger:
        kind: size
        limit: 10 mb
      roller:
        kind: fixed_window
        pattern: logs/azure_ai_gateway.{}.log
        base: 1
        count: 5
    encoder:
      pattern: "{d(%Y-%m-%dT%H:%M:%S%.3f)} [{l}] {t} — {m}{n}"

  # One JSON line per chat request (--request-log), for later analysis of caching and cost.
  requests:
    kind: rolling_file
    path: logs/requests.jsonl
    policy:
      trigger:
        kind: size
        limit: 50 mb
      roller:
        kind: fixed_window
        pattern: logs/requests.{}.jsonl
        base: 1
        count: 10
    encoder:
      pattern: "{m}{n}"

root:
  level: info
  appenders:
    - stdout
    - file

loggers:
  azure_ai_gateway:
    level: debug
    additive: false
    appenders:
      - stdout
      - file

  # Keep the request records out of the main log.
  request_log:
    level: info
    additive: false
    appenders:
      - requests
