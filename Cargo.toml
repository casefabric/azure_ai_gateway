[package]
name = "azure_ai_gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.0", features = ["derive", "env"] }
actix-web = "4.13.0"  # HTTP server
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }  # HTTP client towards Ollama
futures-util = "0.3"  # Stream utilities and join_all
serde = { version = "1", features = ["derive"] }
serde_json = "1"  # Don't enable `preserve_order`: sorted keys keep the prompt byte-stable for caching
percent-encoding = "2"
log = "0.4.29"
log4rs = "1.4.0"
base64 = "0.23.1"
pdf-extract = "0.12.1"
regex = "1"  # --tools-deny
